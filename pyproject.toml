[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "adifcheck"
version = "0.1.0"
description = "Check an ADIF ham-radio log's contents against the ADIF 3.1.8 spec — the values that get logs rejected by LoTW/eQSL — before upload."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "RakTikoo" },
]
keywords = ["adif", "amateur-radio", "ham-radio", "lotw", "eqsl", "qso", "logbook", "validation"]
classifiers = [
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Ham Radio",
]
dependencies = []

[project.scripts]
adifcheck = "adifcheck.cli:main"

[project.urls]
Homepage = "https://github.com/RakTikoo/adifcheck"

[tool.setuptools]
packages = ["adifcheck"]

[tool.setuptools.package-data]
adifcheck = ["data/*.json"]
